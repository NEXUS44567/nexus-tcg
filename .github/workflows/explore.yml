name: Exploration produits
on:
  push:
    branches: [main]
    paths: ['scripts/explore-packs.mjs']
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/explore-packs.mjs
      - run: |
          git config user.name "nexus-prix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/_explore
          git commit -m "Exploration produits" || exit 0
          git pull --rebase origin main
          git push
